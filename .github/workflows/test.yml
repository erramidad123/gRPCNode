name: Run Tests

on:
  push:
    branches: ["main", "Main"]
  pull_request:
    branches: ["main", "Main"]

# Required for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    # Only publish pages from one Node version to avoid conflicts
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload Mochawesome report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-node-${{ matrix.node-version }}
          path: reports/
          retention-days: 14

      # Deploy to GitHub Pages only from one Node version and only on push (not PRs)
      - name: Deploy report to GitHub Pages
        if: always() && matrix.node-version == '20.x' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports
          destination_dir: .
          keep_files: false
