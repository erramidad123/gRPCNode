name: Run Tests

on:
  push:
    branches: ["main", "Main"]
  pull_request:
    branches: ["main", "Main"]
  workflow_dispatch:
    inputs:
      grep:
        description: "Test name to run (leave empty to run all tests)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            npx mocha --grep "${{ github.event.inputs.grep }}"
          else
            npm test
          fi

      - name: Prepare report for Pages
        if: always() && github.event_name != 'pull_request'
        run: cp reports/test-report.html reports/index.html

      - name: Upload Pages artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
