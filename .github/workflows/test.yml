name: Run Tests

on:
  push:
    branches: ["main", "Main"]
  pull_request:
    branches: ["main", "Main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare report for Pages
        if: always() && github.event_name == 'push'
        run: cp reports/test-report.html reports/index.html

      - name: Upload Pages artifact
        if: always() && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
